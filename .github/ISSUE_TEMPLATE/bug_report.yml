name: Bug report
description: Report unexpected package behavior.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example
      description: Include the R code and any seed needed to reproduce the problem.
      render: R
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error output
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include sessionInfo() and the installed rcards version or commit.
